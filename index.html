<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomogaude - My Pet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(180deg, #87ceeb 0%, #87ceeb 60%, #90ee90 60%, #228b22 100%);
      height: 100vh;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      user-select: none;
    }

    /* Clouds */
    .cloud {
      position: absolute;
      background: white;
      border-radius: 50px;
      opacity: 0.85;
    }
    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: white;
      border-radius: 50%;
    }
    .cloud-1 { width: 120px; height: 40px; top: 60px; left: 80px; animation: drift 20s linear infinite; }
    .cloud-1::before { width: 60px; height: 60px; top: -30px; left: 15px; }
    .cloud-1::after { width: 40px; height: 40px; top: -20px; left: 55px; }
    .cloud-2 { width: 90px; height: 30px; top: 100px; left: 400px; animation: drift 28s linear infinite; }
    .cloud-2::before { width: 45px; height: 45px; top: -22px; left: 10px; }
    .cloud-2::after { width: 30px; height: 30px; top: -15px; left: 42px; }
    .cloud-3 { width: 140px; height: 45px; top: 40px; left: 700px; animation: drift 24s linear infinite 5s; }
    .cloud-3::before { width: 70px; height: 70px; top: -35px; left: 20px; }
    .cloud-3::after { width: 50px; height: 50px; top: -25px; left: 65px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(110vw); }
    }

    /* Sun */
    .sun {
      position: absolute;
      top: 30px; right: 80px;
      width: 70px; height: 70px;
      background: #ffe135;
      border-radius: 50%;
      box-shadow: 0 0 30px #ffe135, 0 0 60px #ffaa00;
    }

    /* Ground decoration */
    .flowers {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 40%;
      pointer-events: none;
    }

    .flower {
      position: absolute;
      bottom: 5px;
      font-size: 24px;
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 16px; left: 16px;
      background: rgba(255,255,255,0.85);
      border: 3px solid #6a4c93;
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 4px 4px 0 #6a4c93;
    }
    #hud h2 {
      color: #6a4c93;
      font-size: 18px;
      margin-bottom: 6px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 3px 0;
      font-size: 13px;
      color: #333;
    }
    .stat-bar-bg {
      width: 90px; height: 10px;
      background: #ddd;
      border-radius: 5px;
      overflow: hidden;
    }
    .stat-bar {
      height: 100%;
      border-radius: 5px;
      transition: width 0.3s;
    }
    .bar-happy { background: #ff69b4; }
    .bar-energy { background: #ffd700; }
    .bar-hunger { background: #ff6347; }

    /* Controls hint */
    #controls-hint {
      position: fixed;
      bottom: 16px; right: 16px;
      background: rgba(255,255,255,0.85);
      border: 3px solid #6a4c93;
      border-radius: 12px;
      padding: 12px 16px;
      z-index: 100;
      box-shadow: 4px 4px 0 #6a4c93;
      text-align: center;
      font-size: 13px;
      color: #555;
    }
    #controls-hint .key {
      display: inline-block;
      background: #6a4c93;
      color: white;
      border-radius: 4px;
      padding: 1px 6px;
      margin: 2px;
      font-weight: bold;
    }

    /* Feed button */
    #feed-btn {
      position: fixed;
      bottom: 16px; left: 16px;
      background: #ff69b4;
      color: white;
      border: 3px solid #c0408a;
      border-radius: 12px;
      padding: 10px 20px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      box-shadow: 4px 4px 0 #c0408a;
      z-index: 100;
      transition: transform 0.1s;
    }
    #feed-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #c0408a; }

    /* Pet */
    #pet-container {
      position: absolute;
      width: 80px;
      height: 80px;
      cursor: pointer;
      z-index: 50;
      transition: transform 0.05s;
    }

    /* Speech bubble */
    #speech {
      position: absolute;
      top: -52px; left: 50%;
      transform: translateX(-50%);
      background: white;
      border: 2px solid #6a4c93;
      border-radius: 10px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
      color: #333;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    #speech::after {
      content: '';
      position: absolute;
      bottom: -8px; left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 8px solid #6a4c93;
    }
    #speech.visible { opacity: 1; }

    /* SVG pet canvas */
    #pet-svg {
      width: 80px;
      height: 80px;
    }

    /* Walking animation */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .walking #pet-svg {
      animation: bob 0.3s ease-in-out infinite;
    }

    /* Shadow */
    .pet-shadow {
      position: absolute;
      bottom: -4px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Sky decorations -->
  <div class="sun"></div>
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>

  <!-- Ground flowers -->
  <div class="flowers" id="flowers"></div>

  <!-- HUD -->
  <div id="hud">
    <h2>✨ Lumie ✨</h2>
    <div class="stat-row">
      💖 Happy
      <div class="stat-bar-bg"><div class="stat-bar bar-happy" id="bar-happy" style="width:80%"></div></div>
    </div>
    <div class="stat-row">
      ⚡ Energy
      <div class="stat-bar-bg"><div class="stat-bar bar-energy" id="bar-energy" style="width:90%"></div></div>
    </div>
    <div class="stat-row">
      🍖 Hunger
      <div class="stat-bar-bg"><div class="stat-bar bar-hunger" id="bar-hunger" style="width:40%"></div></div>
    </div>
  </div>

  <!-- Controls hint -->
  <div id="controls-hint">
    <div><span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span></div>
    <div style="margin-top:4px">or <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></div>
    <div style="margin-top:4px">Move Lumie!</div>
  </div>

  <!-- Feed button -->
  <button id="feed-btn">🍖 Feed Lumie</button>

  <!-- Pet -->
  <div id="pet-container">
    <div id="speech">Hiii! 🌟</div>
    <svg id="pet-svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <!-- Tail -->
      <ellipse id="tail" cx="68" cy="52" rx="10" ry="6" fill="#a855f7" transform="rotate(20,68,52)"/>
      <!-- Body -->
      <ellipse cx="38" cy="50" rx="24" ry="20" fill="#c084fc"/>
      <!-- Tummy -->
      <ellipse cx="38" cy="54" rx="14" ry="12" fill="#e9d5ff"/>
      <!-- Back legs -->
      <ellipse cx="20" cy="66" rx="8" ry="5" fill="#a855f7"/>
      <ellipse cx="56" cy="66" rx="8" ry="5" fill="#a855f7"/>
      <!-- Front paws -->
      <ellipse id="paw-l" cx="26" cy="68" rx="7" ry="4" fill="#c084fc"/>
      <ellipse id="paw-r" cx="50" cy="68" rx="7" ry="4" fill="#c084fc"/>
      <!-- Ears -->
      <ellipse cx="25" cy="20" rx="8" ry="12" fill="#c084fc" transform="rotate(-15,25,20)"/>
      <ellipse cx="25" cy="20" rx="4" ry="7" fill="#f0abfc" transform="rotate(-15,25,20)"/>
      <ellipse cx="53" cy="18" rx="8" ry="12" fill="#c084fc" transform="rotate(15,53,18)"/>
      <ellipse cx="53" cy="18" rx="4" ry="7" fill="#f0abfc" transform="rotate(15,53,18)"/>
      <!-- Head -->
      <circle cx="39" cy="32" r="20" fill="#c084fc"/>
      <!-- Face shine -->
      <circle cx="30" cy="24" r="5" fill="#e9d5ff" opacity="0.5"/>
      <!-- Eyes -->
      <circle id="eye-l" cx="32" cy="30" r="5" fill="white"/>
      <circle cx="32" cy="30" r="3" fill="#1a1a2e"/>
      <circle cx="33" cy="29" r="1" fill="white"/>
      <circle id="eye-r" cx="46" cy="30" r="5" fill="white"/>
      <circle cx="46" cy="30" r="3" fill="#1a1a2e"/>
      <circle cx="47" cy="29" r="1" fill="white"/>
      <!-- Nose -->
      <ellipse cx="39" cy="36" rx="3" ry="2" fill="#9333ea"/>
      <!-- Mouth (happy) -->
      <path id="mouth" d="M 34 40 Q 39 45 44 40" stroke="#9333ea" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- Cheek blushes -->
      <ellipse cx="25" cy="36" rx="5" ry="3" fill="#f472b6" opacity="0.5"/>
      <ellipse cx="53" cy="36" rx="5" ry="3" fill="#f472b6" opacity="0.5"/>
      <!-- Horn / sparkle on head -->
      <polygon points="39,6 42,16 36,16" fill="#fbbf24"/>
      <circle cx="39" cy="5" r="3" fill="#fde68a"/>
    </svg>
    <div class="pet-shadow"></div>
  </div>

  <script>
    const pet = document.getElementById('pet-container');
    const speech = document.getElementById('speech');
    const svgEl = document.getElementById('pet-svg');
    const feedBtn = document.getElementById('feed-btn');
    const pawL = document.getElementById('paw-l');
    const pawR = document.getElementById('paw-r');
    const tail = document.getElementById('tail');
    const mouth = document.getElementById('mouth');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');

    // Stats
    let happy = 80, energy = 90, hunger = 40;
    let x = window.innerWidth / 2 - 40;
    let y = window.innerHeight / 2 - 40;
    let speed = 3;
    let facingLeft = false;
    let moving = false;
    let speechTimer = null;
    let blinkTimer = null;
    let tailAngle = 0;
    let pawPhase = 0;

    const keys = {};

    // Place flowers
    const flowerEmojis = ['🌸','🌼','🌻','🌺','🌷','🍀','🌿'];
    const flowersDiv = document.getElementById('flowers');
    for (let i = 0; i < 30; i++) {
      const f = document.createElement('div');
      f.className = 'flower';
      f.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
      f.style.left = Math.random() * 100 + '%';
      f.style.fontSize = (16 + Math.random() * 16) + 'px';
      f.style.bottom = (Math.random() * 30) + 'px';
      flowersDiv.appendChild(f);
    }

    pet.style.left = x + 'px';
    pet.style.top = y + 'px';

    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    function updateStats() {
      document.getElementById('bar-happy').style.width = happy + '%';
      document.getElementById('bar-energy').style.width = energy + '%';
      document.getElementById('bar-hunger').style.width = hunger + '%';
    }

    function showSpeech(text, duration = 2000) {
      speech.textContent = text;
      speech.classList.add('visible');
      clearTimeout(speechTimer);
      speechTimer = setTimeout(() => speech.classList.remove('visible'), duration);
    }

    const happyPhrases = ['Weeee! 🌟', 'I love you! 💖', 'This is fun!', 'Yay! ✨', '*happy bouncing*'];
    const hungryPhrases = ['Feed me! 🍖', 'So hungry...', 'My tummy growls!'];

    feedBtn.addEventListener('click', () => {
      hunger = Math.min(100, hunger + 25);
      happy = Math.min(100, happy + 10);
      updateStats();
      showSpeech('Yummy! 😋');
    });

    pet.addEventListener('click', () => {
      happy = Math.min(100, happy + 5);
      updateStats();
      showSpeech(happyPhrases[Math.floor(Math.random() * happyPhrases.length)]);
    });

    // Blink animation
    function blink() {
      eyeL.setAttribute('ry', '1');
      eyeR.setAttribute('ry', '1');
      setTimeout(() => {
        eyeL.setAttribute('ry', '5');
        eyeR.setAttribute('ry', '5');
      }, 150);
      blinkTimer = setTimeout(blink, 2000 + Math.random() * 3000);
    }
    blink();

    // Stat drain over time
    setInterval(() => {
      hunger = Math.max(0, hunger - 1);
      energy = Math.max(0, energy - 0.5);
      if (hunger < 20 && Math.random() < 0.1) showSpeech(hungryPhrases[Math.floor(Math.random() * hungryPhrases.length)]);
      if (hunger < 20) happy = Math.max(0, happy - 0.5);
      updateStats();
    }, 3000);

    // Game loop
    let frame = 0;
    function loop() {
      frame++;
      let dx = 0, dy = 0;
      let currentSpeed = speed;

      if (energy < 20) currentSpeed = 1.5;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) { dx -= currentSpeed; facingLeft = true; }
      if (keys['ArrowRight'] || keys['d'] || keys['D']) { dx += currentSpeed; facingLeft = false; }
      if (keys['ArrowUp'] || keys['w'] || keys['W']) dy -= currentSpeed;
      if (keys['ArrowDown'] || keys['s'] || keys['S']) dy += currentSpeed;

      // Normalize diagonal
      if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }

      moving = dx !== 0 || dy !== 0;

      x = Math.max(0, Math.min(window.innerWidth - 80, x + dx));
      y = Math.max(0, Math.min(window.innerHeight - 90, y + dy));

      pet.style.left = x + 'px';
      pet.style.top = y + 'px';

      // Flip SVG for direction
      svgEl.style.transform = facingLeft ? 'scaleX(-1)' : 'scaleX(1)';

      // Walking bob
      if (moving) {
        pet.classList.add('walking');
        energy = Math.max(0, energy - 0.01);
        // Paw animation
        pawPhase += 0.3;
        const pOffset = Math.sin(pawPhase) * 4;
        pawL.setAttribute('cy', 68 + pOffset);
        pawR.setAttribute('cy', 68 - pOffset);
      } else {
        pet.classList.remove('walking');
        pawL.setAttribute('cy', 68);
        pawR.setAttribute('cy', 68);
      }

      // Tail wag
      tailAngle = 20 + Math.sin(frame * 0.1) * 20;
      tail.setAttribute('transform', `rotate(${tailAngle},68,52)`);

      // Mood face
      if (happy > 50) {
        mouth.setAttribute('d', 'M 34 40 Q 39 45 44 40');
      } else if (happy > 20) {
        mouth.setAttribute('d', 'M 34 40 Q 39 42 44 40');
      } else {
        mouth.setAttribute('d', 'M 34 43 Q 39 39 44 43');
      }

      updateStats();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
