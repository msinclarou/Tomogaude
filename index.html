<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomogaude</title>
  <style>
    body {
      background-color: #99ccff;
      background-image: repeating-linear-gradient(
        0deg, transparent, transparent 19px, rgba(255,255,255,0.3) 20px
      ),
      repeating-linear-gradient(
        90deg, transparent, transparent 19px, rgba(255,255,255,0.3) 20px
      );
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      color: #330066;
      font-size: 32px;
      text-shadow: 2px 2px 0 #ff99cc, 4px 4px 0 #cc66ff;
      letter-spacing: 3px;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: #660099;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .main-layout {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .panel {
      background: white;
      border: 3px solid #330066;
      border-radius: 4px;
      box-shadow: 4px 4px 0 #330066;
      padding: 14px 18px;
    }

    .panel h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: white;
      background: #330066;
      padding: 4px 8px;
      margin: -14px -18px 12px -18px;
      border-radius: 0;
      letter-spacing: 1px;
    }

    /* Pet panel */
    .pet-panel {
      width: 280px;
      text-align: center;
    }

    #pet-display {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      line-height: 1.35;
      white-space: pre;
      color: #330066;
      display: inline-block;
      text-align: left;
      margin: 10px 0;
      background: #f0e6ff;
      padding: 12px 16px;
      border: 2px dashed #cc66ff;
      border-radius: 4px;
    }

    #pet-display.jump {
      animation: jump 0.5s ease-out;
    }

    @keyframes jump {
      0%   { transform: translateY(0);   }
      25%  { transform: translateY(-28px) rotate(-8deg); }
      50%  { transform: translateY(-40px) rotate(8deg);  }
      75%  { transform: translateY(-16px) rotate(-4deg); }
      100% { transform: translateY(0)   rotate(0deg);    }
    }

    #pet-name {
      font-size: 18px;
      font-weight: bold;
      color: #330066;
      letter-spacing: 2px;
    }

    #pet-mood {
      font-size: 13px;
      color: #660099;
      min-height: 18px;
      margin-bottom: 4px;
      font-style: italic;
    }

    /* Stats panel */
    .stats-panel {
      width: 240px;
    }

    .stat-block {
      margin-bottom: 14px;
    }

    .stat-label {
      font-size: 13px;
      color: #330066;
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }

    .stat-pct {
      color: #660099;
    }

    .bar-outer {
      width: 100%;
      height: 18px;
      background: #ddd;
      border: 2px solid #330066;
      border-radius: 2px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      transition: width 0.4s ease, background 0.4s;
      background: #ff3333;
    }

    .bar-inner.fed {
      background: #33cc33;
    }

    /* Money panel */
    .money-panel {
      width: 240px;
    }

    #money-display {
      font-size: 36px;
      font-weight: bold;
      color: #006600;
      text-align: center;
      letter-spacing: 1px;
      padding: 10px 0 4px;
      text-shadow: 1px 1px 0 #ccffcc;
    }

    #money-label {
      text-align: center;
      font-size: 12px;
      color: #339933;
      margin-bottom: 6px;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button {
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      padding: 8px 20px;
      border-radius: 3px;
      cursor: pointer;
      border: 3px solid;
      box-shadow: 3px 3px 0;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0;
    }

    #feed-btn {
      background: #ffcc00;
      color: #330066;
      border-color: #cc9900;
      box-shadow-color: #cc9900;
      box-shadow: 3px 3px 0 #cc9900;
    }

    #work-btn {
      background: #cc66ff;
      color: white;
      border-color: #660099;
      box-shadow: 3px 3px 0 #660099;
    }

    #work-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: 3px 3px 0 #660099;
    }

    /* Log */
    .log-panel {
      width: 580px;
    }

    #log {
      height: 90px;
      overflow-y: auto;
      font-size: 12px;
      color: #330066;
      background: #f9f0ff;
      border: 1px solid #cc99ff;
      padding: 6px 8px;
      line-height: 1.6;
    }

    #log p {
      margin: 0;
    }

    #log p::before {
      content: '> ';
      color: #cc66ff;
    }

    .divider {
      border: none;
      border-top: 2px dashed #cc99ff;
      margin: 8px 0;
    }
  </style>
</head>
<body>

  <h1>✦ TOMOGAUDE ✦</h1>
  <p class="subtitle">— your very own virtual companion —</p>

  <div class="main-layout">

    <!-- Pet display -->
    <div class="panel pet-panel">
      <h3>✦ YOUR PET</h3>
      <div id="pet-name">LUMIE</div>
      <div id="pet-display"></div>
      <div id="pet-mood">*stares at you expectantly*</div>
      <div class="btn-row">
        <button id="feed-btn">🍖 FEED</button>
        <button id="work-btn">💼 WORK</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="panel stats-panel">
      <h3>✦ STATS</h3>

      <div class="stat-block">
        <div class="stat-label">
          <span>🍖 HUNGER</span>
          <span class="stat-pct" id="hunger-pct">0%</span>
        </div>
        <div class="bar-outer">
          <div class="bar-inner" id="hunger-bar" style="width:0%"></div>
        </div>
      </div>

      <hr class="divider">

      <!-- Money -->
      <div id="money-display">$0</div>
      <div id="money-label">MONEY!</div>
    </div>

    <!-- Log -->
    <div class="panel log-panel">
      <h3>✦ ACTIVITY LOG</h3>
      <div id="log">
        <p>Lumie has arrived! She looks around curiously.</p>
      </div>
    </div>

  </div>

<script>
  let hunger = 0;
  let money = 0;
  let working = false;

  const petDisplay = document.getElementById('pet-display');
  const hungerBar = document.getElementById('hunger-bar');
  const hungerPct = document.getElementById('hunger-pct');
  const petMood = document.getElementById('pet-mood');
  const moneyDisplay = document.getElementById('money-display');
  const log = document.getElementById('log');
  const workBtn = document.getElementById('work-btn');
  const feedBtn = document.getElementById('feed-btn');

  // ASCII art faces
  const SAD_PET = `
  /\\_____/\\
 (  o   o  )
  =  ---  =     "..."
  (  ___  )
   \\_____/
  __|| ||__
 (__)   (__)`.trim();

  const HAPPY_PET = `
  /\\_____/\\
 (  ^   ^  )
  =  ___  =     ":D"
  (       )
   \\_____/
  __|| ||__
 (__)   (__)`.trim();

  const WORK_PET = `
  /\\_____/\\
 (  *   *  )
  = \\___/ =     "!!!"
  (       )
   \\_____/
  __|| ||__
 (__)   (__)`.trim();

  function renderPet(face) {
    petDisplay.textContent = face || (hunger >= 50 ? HAPPY_PET : SAD_PET);
  }

  function updateHunger() {
    hungerBar.style.width = hunger + '%';
    hungerPct.textContent = hunger + '%';
    if (hunger >= 50) {
      hungerBar.classList.add('fed');
      petMood.textContent = '*wags tail happily* :)';
    } else {
      hungerBar.classList.remove('fed');
      if (hunger === 0) {
        petMood.textContent = '*stares at you expectantly*';
      } else {
        petMood.textContent = '*still looks hungry...*';
      }
    }
    renderPet();
  }

  function addLog(msg) {
    const p = document.createElement('p');
    p.textContent = msg;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  feedBtn.addEventListener('click', () => {
    if (hunger >= 100) {
      addLog('Lumie is too full to eat!');
      return;
    }
    hunger = Math.min(100, hunger + 20);
    updateHunger();
    const msgs = [
      'Lumie gobbles up the food!',
      'Lumie munches happily.',
      'Nom nom nom...',
      'Lumie says thank you!',
    ];
    addLog(msgs[Math.floor(Math.random() * msgs.length)]);
  });

  workBtn.addEventListener('click', () => {
    if (working) return;
    working = true;
    workBtn.disabled = true;

    // Show excited face
    petDisplay.textContent = WORK_PET;
    petMood.textContent = '*zooooom*';

    // Trigger jump animation
    petDisplay.classList.remove('jump');
    void petDisplay.offsetWidth; // reflow
    petDisplay.classList.add('jump');

    const earns = hunger >= 50 ? 20 : 10;
    money += earns;
    moneyDisplay.textContent = '$' + money;

    const msgs = hunger >= 50 ? [
      `Lumie is well-fed and crushed it at work! +$${earns}!`,
      `Full tummy = big energy! Lumie earned $${earns}!`,
      `Lumie hustled extra hard — $${earns} earned!`,
      `Happy Lumie is a productive Lumie! +$${earns}.`,
    ] : [
      `Lumie went to work and earned $${earns}!`,
      `Lumie hustled hard — $${earns} earned!`,
      `Lumie completed a job! +$${earns}.`,
      `Lumie brought home $${earns}. Good girl!`,
    ];
    addLog(msgs[Math.floor(Math.random() * msgs.length)]);

    // Drain some hunger from working
    if (hunger > 0) {
      hunger = Math.max(0, hunger - 10);
    }

    setTimeout(() => {
      petDisplay.classList.remove('jump');
      updateHunger();
      working = false;
      workBtn.disabled = false;
    }, 600);
  });

  // Passive hunger drain every 30 seconds
  setInterval(() => {
    if (hunger > 0) {
      hunger = Math.max(0, hunger - 5);
      updateHunger();
      if (hunger <= 10) addLog('Lumie is very hungry!');
    }
  }, 30000);

  // Init
  updateHunger();
</script>
</body>
</html>
