<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tomogaude</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>✦ TOMOGAUDE ✦</h1>
  <p class="subtitle">— your very own virtual companion —</p>

  <div class="main-layout">

    <!-- Pet display -->
    <div class="panel pet-panel">
      <h3>✦ YOUR PET</h3>
      <div id="pet-name">LUMIE</div>
      <div id="pet-display"></div>
      <div id="pet-mood">*stares at you expectantly*</div>
      <div class="btn-row">
        <button id="feed-btn">🍖 FEED</button>
        <button id="work-btn">💼 WORK</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="panel stats-panel">
      <h3>✦ STATS</h3>

      <div class="stat-block">
        <div class="stat-label">
          <span>🍖 HUNGER</span>
          <span class="stat-pct" id="hunger-pct">0%</span>
        </div>
        <div class="bar-outer">
          <div class="bar-inner" id="hunger-bar" style="width:0%"></div>
        </div>
      </div>

      <hr class="divider">

      <div id="money-display">$0</div>
      <div id="money-label">MONEY!</div>
    </div>

    <!-- Log -->
    <div class="panel log-panel">
      <h3>✦ ACTIVITY LOG</h3>
      <div id="log">
        <p>Lumie has arrived! She looks around curiously.</p>
      </div>
    </div>

    <!-- Instruction panel -->
    <div class="panel instruction-panel">
      <h3>✦ INSTRUCTION PANEL</h3>
      <p class="instruction-hint">One command per line. Try <em>press work button</em> or <em>press feed button</em>, then hit START.</p>
      <textarea id="instruction-input" spellcheck="false" rows="5">press work button
press work button
press work button</textarea>
      <div class="instruction-list" id="instruction-list"></div>
      <div class="btn-row">
        <button id="run-btn">▶ START</button>
        <button id="stop-btn">■ STOP</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
